{% if messages %}
  <div class="container mt-3">
       {% for message in messages %}
      <div class="visible-message {% if message.tags == 'success' %}success{% elif message.tags == 'error' or message.tags == 'danger' %}error{% endif %}">
           {{ message }}
         <button type="button" class="close-btn" onclick="this.parentElement.style.display='none';">&times;</button>
      </div>
    {% endfor %}
  </div>
  <script>
    // Auto-hide visible messages after 3 seconds with a short fade
    (function(){
      document.addEventListener('DOMContentLoaded', function(){
        var msgs = document.querySelectorAll('.visible-message');
        if (!msgs || msgs.length === 0) return;
        setTimeout(function(){
          msgs.forEach(function(m){
            try {
              m.style.transition = 'opacity 0.4s ease';
              m.style.opacity = '0';
              setTimeout(function(){ m.style.display = 'none'; }, 450);
            } catch(e) { try { m.style.display = 'none'; } catch(_){} }
          });
        }, 3000);
      });
    })();
  </script>
{% endif %}
