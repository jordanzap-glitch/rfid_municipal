{% extends "includes/base.html" %}
{% load static %}
{% block content %} 

  <style>
    /* Page-local full-body background inserted inside the body element */
    .page-bg {
      position: fixed;
      inset: 0;
      background-image: url("{% static 'img/bg-santa-rita.jpg' %}");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
      filter: saturate(0.9) brightness(1.0);
    }
    /* make sure page content sits above the background */
    #app, .main-wrapper, .section { position: relative; z-index: 1; }
  </style>

  <div class="page-bg" aria-hidden="true"></div>

  <section class="section">
  <div class="section-header">
    <h1>
      Welcome to the System Admin Dashboard
    </h1>
  </div>
  <div class="section-body">

    <div class="row">
      <!-- Sub Admin -->
      <div class="col-lg-3 col-md-6 col-sm-6 col-12">
        <div class="card card-statistic-1">
          <div class="card-icon bg-primary">
            <i class="fas fa-user-shield"></i>
          </div>
          <div class="card-wrap">
            <div class="card-header">
              <h4>Sub Admin</h4>
            </div>
            <div class="card-body">
              12
            </div>
          </div>
        </div>
      </div>

      <!-- Pending -->
      <div class="col-lg-3 col-md-6 col-sm-6 col-12">
        <div class="card card-statistic-1">
          <div class="card-icon bg-warning">
            <i class="fas fa-clock"></i>
          </div>
          <div class="card-wrap">
            <div class="card-header">
              <h4>Pending</h4>
            </div>
            <div class="card-body">
              7
            </div>
          </div>
        </div>
      </div>

      <!-- Reports -->
      <div class="col-lg-3 col-md-6 col-sm-6 col-12">
        <div class="card card-statistic-1">
          <div class="card-icon bg-info">
            <i class="fas fa-file-alt"></i>
          </div>
          <div class="card-wrap">
            <div class="card-header">
              <h4>Reports</h4>
            </div>
            <div class="card-body">
              25
            </div>
          </div>
        </div>
      </div>

      <!-- New Registration -->
      <div class="col-lg-3 col-md-6 col-sm-6 col-12">
        <div class="card card-statistic-1">
          <div class="card-icon bg-success">
            <i class="fas fa-user-plus"></i>
          </div>
          <div class="card-wrap">
            <div class="card-header">
              <h4>New Registration</h4>
            </div>
            <div class="card-body">
              5
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

{% endblock %}
