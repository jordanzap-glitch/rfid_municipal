{% extends "includes/base.html" %}
{% load static %}
{% block content %} 

<section class="section">
    <div class="section-header">
        <h1>Registration</h1>
    </div>

    <div class="section-body">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 mx-auto">
                <form method="post" enctype="multipart/form-data" class="card" action="{% url 'sysadmin_register' %}">
                    {% csrf_token %}

                    


                    <div class="card-header">
                        <h4>Create new registration</h4>
                    </div>

                    {% include "includes/message.html" %}
        
                    <div class="card-body">

                        <div class="d-flex align-items-start mb-3">
                            <div class="profile-upload mr-3 text-center">
                                <div id="profilePreview" class="profile-box">
                                    <span style="font-size:12px;">No image<br>selected</span>
                                </div>
                                <div class="mt-2">
                                    <label for="profile_pic" class="btn btn-sm btn-outline-primary profile-upload-label">Upload</label>
                                </div>
                                <input type="file" name="profile_pic" id="profile_pic" accept="image/*" style="display:none;" />
                            </div>
                            <div class="flex-fill">
                                <div class="d-flex justify-content-end mb-2">
                                    <div style="min-width:220px; max-width:320px;">
                                        <label for="end_user_type" class="sr-only">End user type</label>
                                        <select name="end_user_type" id="end_user_type" class="form-control form-control-sm" required>
                                            <option value="" disabled selected>-- select end user type --</option>
                                            {% for et in end_user_types %}
                                                <option value="{{ et.id }}">{{ et.end_user_type }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <p class="text-muted mb-0">Upload a square profile image (recommended 300×300). Click "Upload" to choose a file.
                                </p>
                            </div>
                        </div>
                        <div class="row">
                            
                        
                            <div class="form-group col-md-6">
                                <label for="rfid">RFID (required)</label>
                                <input type="text" name="rfid" id="rfid" class="form-control" maxlength="50" />
                            </div>

                            <div class="form-group col-md-6">
                                <label for="mobile_no">Mobile Number</label>
                                <input type="tel" name="mobile_no" id="mobile_no" class="form-control" maxlength="20" required />
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-md-4">
                                <label for="last_name">Last name</label>
                                <input type="text" name="last_name" id="last_name" class="form-control" required />
                            </div>
                            <div class="form-group col-md-4">
                                <label for="first_name">First name</label>
                                <input type="text" name="first_name" id="first_name" class="form-control" required />
                            </div>
                            <div class="form-group col-md-4">
                                <label for="middle_name">Middle name</label>
                                <input type="text" name="middle_name" id="middle_name" class="form-control" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-md-3">
                                <label for="name_extension">Name extension</label>
                                <input type="text" name="name_extension" id="name_extension" class="form-control" maxlength="10" />
                            </div>
                            <div class="form-group col-md-3">
                                <label for="date_of_birth">Date of birth</label>
                                <input type="date" name="date_of_birth" id="date_of_birth" class="form-control" required />
                            </div>
                            <div class="form-group col-md-2">
                                <label for="age">Age</label>
                                <input type="number" name="age" id="age" class="form-control" min="0" max="150" step="1" placeholder="Auto-calculated" aria-label="Age" />
                            </div>
                            <div class="form-group col-md-4">
                                <label for="place_of_birth">Place of birth</label>
                                <input type="text" name="place_of_birth" id="place_of_birth" class="form-control" required />
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-md-3">
                                <label for="gender">Gender</label>
                                <select name="gender" id="gender" class="form-control">
                                    <option value="">-- select gender --</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group col-md-3">
                                <label for="civil_status">Civil Status</label>
                                <select name="civil_status" id="civil_status" class="form-control">
                                    <option value="">-- select civil status --</option>
                                    <option value="Single">Single</option>
                                    <option value="Married">Married</option>
                                    <option value="Widowed">Widowed</option>
                                    <option value="Separated">Separated</option>
                                    <option value="Divorced">Divorced</option>
                                </select>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="occupation">Occupation</label>
                                <input type="text" name="occupation" id="occupation" class="form-control" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-md-6">
                                <label for="email">Email</label>
                                <input type="email" name="email" id="email" class="form-control" maxlength="100" />
                            </div>
                            <div class="form-group col-md-6">
                                <label for="zone_street">Zone / Street</label>
                                <input type="text" name="zone_street" id="zone_street" class="form-control" maxlength="200" placeholder="Zone / Street" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-md-4">
                                <label for="province">Province</label>
                                <select name="province" id="province" class="form-control" required>
                                    <option value="">-- select province --</option>
                                    {% for p in provinces %}
                                        <option value="{{ p.id }}" {% if p.id == 1 %}selected{% endif %}>{{ p.province_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group col-md-4">
                                <label for="municipality">Municipality</label>
                                <select name="municipality" id="municipality" class="form-control" required>
                                    <option value="">-- select municipality --</option>
                                </select>
                            </div>

                            <div class="form-group col-md-4">
                                <label for="barangay">Barangay</label>
                                <select name="barangay" id="barangay" class="form-control" required>
                                    <option value="">-- select barangay --</option>
                                </select>
                            </div>
                        </div>

                        <!-- file input removed from bottom, upload control is above -->
                    </div>

                    <div class="card-footer text-right">
                        <button type="submit" class="btn btn-outline-primary">Save registration</button >
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<script>
// Preview selected profile image in the circular preview
// and automatically calculate age from date of birth
document.addEventListener('DOMContentLoaded', function(){
    // Image preview
    (function(){
        const input = document.getElementById('profile_pic');
        const preview = document.getElementById('profilePreview');
        if(!input || !preview) return;
        input.addEventListener('change', function(e){
            const file = e.target.files && e.target.files[0];
            if(!file) {
                preview.style.backgroundImage = '';
                preview.innerHTML = '<span style="font-size:12px;">No image<br>selected</span>';
                return;
            }
            const url = URL.createObjectURL(file);
            preview.style.backgroundImage = `url(${url})`;
            preview.innerHTML = '';
        });
    })();

    // Age calculation
    (function(){
        const dobInput = document.getElementById('date_of_birth');
        const ageInput = document.getElementById('age');
        if(!dobInput || !ageInput) return;

        function calculateAge(dobString){
            if(!dobString) return '';
            const dob = new Date(dobString);
            if (isNaN(dob)) return '';
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())){
                age--;
            }
            return age >= 0 ? age : '';
        }

        function updateAge(){
            const age = calculateAge(dobInput.value);
            ageInput.value = (age === '') ? '' : age;
        }

        dobInput.addEventListener('change', updateAge);
        dobInput.addEventListener('input', updateAge);
        updateAge();
    })();
});
</script>


{% endblock %}
