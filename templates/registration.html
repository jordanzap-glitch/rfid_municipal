<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
  <title>403 &mdash; Stisla</title>

  <!-- General CSS Files -->
  <link rel="stylesheet" href="{% static 'modules/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'modules/fontawesome/css/all.min.css' %}">

  <!-- CSS Libraries -->

  <!-- Template CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/style_registration.css' %}">
<!-- Start GA -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-94034622-3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-94034622-3');
</script>
<!-- /END GA --></head>

<body>
  <div id="app">
    <section class="section">
      <div class="container mt-5">
    <!-- Registration Form Start -->
    <section class="section">
      <div class="section-header">
        <h1>Registration</h1>
      </div>

      <div class="section-body">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8 mx-auto">
            <form method="post" enctype="multipart/form-data" class="card" action="{% url 'registration_member' %}">
              {% csrf_token %}

              <div class="card-header">
                <h4>Create new registration</h4>
              </div>

              {% include "includes/message.html" %}

              <div class="card-body">
                <div class="d-flex align-items-start mb-3">
                  <div class="profile-upload mr-3 text-center">
                    <div id="profilePreview" class="profile-box">
                      <span style="font-size:12px;">No image<br>selected</span>
                    </div>
                    <div class="mt-2">
                      <label for="profile" class="btn btn-sm btn-outline-primary profile-upload-label">Upload</label>
                    </div>
                    <input type="file" name="profile" id="profile" accept="image/*" style="display:none;" />
                  </div>
                  <div class="flex-fill">
                    <p class="text-muted mb-0">Upload a square profile image (recommended 300×300). Click "Upload" to choose a file.
                    </p>
                  </div>
                </div>
                <div class="row">
                  <div class="form-group col-md-6">
                    <label for="rfid">RFID (required)</label>
                    <input type="text" name="rfid" id="rfid" class="form-control" maxlength="50" />
                  </div>

                  <div class="form-group col-md-6">
                    <label for="mobile_no">Mobile Number</label>
                    <input type="tel" name="mobile_no" id="mobile_no" class="form-control" maxlength="20" required />
                  </div>
                </div>

                <div class="row">
                  <div class="form-group col-md-4">
                    <label for="last_name">Last name</label>
                    <input type="text" name="last_name" id="last_name" class="form-control" required />
                  </div>
                  <div class="form-group col-md-4">
                    <label for="first_name">First name</label>
                    <input type="text" name="first_name" id="first_name" class="form-control" required />
                  </div>
                  <div class="form-group col-md-4">
                    <label for="middle_name">Middle name</label>
                    <input type="text" name="middle_name" id="middle_name" class="form-control" />
                  </div>
                </div>

                <div class="row">
                  <div class="form-group col-md-3">
                    <label for="name_extension">Name extension</label>
                    <input type="text" name="name_extension" id="name_extension" class="form-control" maxlength="10" />
                  </div>
                  <div class="form-group col-md-3">
                    <label for="date_of_birth">Date of birth</label>
                    <input type="date" name="date_of_birth" id="date_of_birth" class="form-control" required />
                  </div>
                  <div class="form-group col-md-6">
                    <label for="place_of_birth">Place of birth</label>
                    <input type="text" name="place_of_birth" id="place_of_birth" class="form-control" required />
                  </div>
                </div>

                <div class="row">
                    <div class="form-group col-md-3">
                    <label for="gender">Gender</label>
                    <select name="gender" id="gender" class="form-control">
                        <option value="">select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    </div>
                    <div class="form-group col-md-3">
                    <label for="civil_status">Civil Status</label>
                    <select name="civil_status" id="civil_status" class="form-control">
                        <option value="">select civil status</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Widowed">Widowed</option>
                        <option value="Separated">Separated</option>
                        <option value="Divorced">Divorced</option>
                    </select>
                    </div>
                    <div class="form-group col-md-6">
                    <label for="occupation">Occupation</label>
                    <input type="text" name="occupation" id="occupation" class="form-control" />
                    </div>
                </div>
                <div class="row">
                  <div class="form-group col-md-4">
                    <label for="province">Province</label>
                    <select name="province" id="province" class="form-control" required>
                      <option value="">-- select province --</option>
                      {% for p in provinces %}
                        <option value="{{ p.id }}" {% if p.id == 1 %}selected{% endif %}>{{ p.province_name }}</option>
                      {% endfor %}
                    </select>
                  </div>

                  <div class="form-group col-md-4">
                    <label for="municipality">Municipality</label>
                    <select name="municipality" id="municipality" class="form-control" required>
                      <option value="">-- select municipality --</option>
                    </select>
                  </div>

                  <div class="form-group col-md-4">
                    <label for="barangay">Barangay</label>
                    <select name="barangay" id="barangay" class="form-control" required>
                      <option value="">-- select barangay --</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="card-footer text-right">
                <button type="submit" class="btn btn-outline-primary">Save registration</button >
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
    <!-- Registration Form End -->
      </div>
    </section>
  </div>

  <!-- General JS Scripts -->
  <script src="{% static 'modules/jquery.min.js' %}"></script>
  <script src="{% static 'modules/popper.js' %}"></script>
  <script src="{% static 'modules/tooltip.js' %}"></script>
  <script src="{% static 'modules/bootstrap/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'modules/nicescroll/jquery.nicescroll.min.js' %}"></script>
  <script src="{% static 'modules/moment.min.js' %}"></script>
  <script src="{% static 'js/stisla.js' %}"></script>

  <!-- JS Libraies -->

  <!-- Page Specific JS File -->
  
  <!-- Template JS File -->
  <script src="{% static 'js/scripts.js' %}"></script>
  <script src="{% static 'js/custom.js' %}"></script>
  <script src="{% static 'js/address_geo.js' %}"></script>
</body>
<script>
// Preview selected profile image in the circular preview
document.addEventListener('DOMContentLoaded', function(){
  const input = document.getElementById('profile');
  const preview = document.getElementById('profilePreview');
  if(!input || !preview) return;
  input.addEventListener('change', function(e){
    const file = e.target.files && e.target.files[0];
    if(!file) {
      preview.style.backgroundImage = '';
      preview.innerHTML = '<span style="font-size:12px;">No image<br>selected</span>';
      return;
    }
    const url = URL.createObjectURL(file);
    preview.style.backgroundImage = `url(${url})`;
    preview.innerHTML = '';
  });
});
</script>
</body>
</html>
